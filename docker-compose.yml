# Dịch vụ cho môi trường dev (npm run db:up). Các phần sau thêm Redis, MinIO, Mailpit.
name: novel-platform

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: novel
      POSTGRES_DB: novel
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U novel -d novel']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
